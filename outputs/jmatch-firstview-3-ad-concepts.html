:root{--navy:#173451;--orange:#e96f1d;--teal:#167f82}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-snap-type:y mandatory}body{margin:0;font-family:Inter,"Noto Sans JP","Yu Gothic",sans-serif;color:var(--navy);background:#fff}
.nav{position:fixed;top:16px;left:50%;z-index:20;transform:translateX(-50%);display:flex;gap:7px;padding:6px;border:1px solid rgba(23,52,81,.12);border-radius:999px;background:rgba(255,255,255,.86);box-shadow:0 8px 30px rgba(23,52,81,.09);backdrop-filter:blur(14px)}.nav a{padding:8px 16px;border-radius:999px;color:var(--navy);text-decoration:none;font-size:12px;font-weight:900;white-space:nowrap}.nav a:hover{background:#eef4f7}

#furniture{background:#fff8ef}#furniture .copy{margin-top:4vh}#furniture .tag{color:var(--teal)}
#advertising{background:#eef8ff}#advertising .tag{color:var(--orange)}#advertising .copy h1{font-size:clamp(38px,4.8vw,72px)}
#onsen::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,27,43,.8) 0%,rgba(7,27,43,.57) 35%,rgba(7,27,43,.04) 68%)}#onsen .copy{color:#fff;text-shadow:0 2px 24px rgba(0,0,0,.22)}#onsen .tag{color:#ffd19f}#onsen .copy h1 em{color:#ffb565}#onsen .amount{color:#fff;background:rgba(8,31,49,.54);border:1px solid rgba(255,255,255,.22)}#onsen .amount b{color:#ffb565}#onsen .fine{color:rgba(255,255,255,.72)}
@media(max-width:760px){.nav{top:8px}.nav a{padding:7px 10px;font-size:10px}.ad{align-items:flex-end;min-height:100svh}.visual img{object-position:62% center}.copy{width:auto;margin:0 22px 62px;padding:20px;border-radius:20px;background:rgba(255,255,255,.86);backdrop-filter:blur(10px)}.copy h1,#advertising .copy h1{font-size:38px}.tag{margin-bottom:10px}.amount{margin-top:16px;padding:7px 11px}.amount b{font-size:28px}#onsen .copy{background:rgba(7,27,43,.66)}#onsen::after{background:linear-gradient(180deg,transparent 30%,rgba(7,27,43,.55) 78%)}.fine{bottom:7px}}
